# Initiator = the "app" side (TradeClient). Connects to localhost:9876.
[DEFAULT]
ConnectionType=initiator
SocketConnectHost=127.0.0.1
SocketConnectPort=9876
StartTime=00:00:00
EndTime=23:59:59
FileStorePath=./store-initiator
FileLogPath=./log-initiator
UseDataDictionary=N
HeartBtInt=30
ResetOnLogon=N
ValidateUserDefinedFields=N
ReconnectInterval=5

[SESSION]
